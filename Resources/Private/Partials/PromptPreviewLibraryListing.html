<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:for each="{usagePagePreviewPanels}" as="panel">
    <template
        id="{panel.targetId}"
        data-page-id="{panel.pageId}"
        data-modal-title="{panel.modalTitle}"
        data-label-empty="{panel.labelEmpty}"
        data-label-characters="{panel.labelCharacters}"
        data-label-tokens="{panel.labelTokens}"
        data-label-page-tone="{panel.labelPageTone}"
        data-label-global-fallback="{panel.labelGlobalFallback}"
        data-label-user-fragments="{panel.labelUserFragments}"
        data-label-registry-fragments="{panel.labelRegistryFragments}"
        data-label-provider-addendum="{panel.labelProviderAddendum}"
    >
        <f:render partial="PromptPreviewPanel" arguments="{scopeOptions: scopeOptions, providerConfigurations: providerConfigurations}" />
    </template>
</f:for>

<f:if condition="{hasFragmentReadAccess}">
    <f:then>
        <f:if condition="{paginator.paginatedItems}">
            <f:then>
                <f:render partial="PromptManagementFilter" arguments="{_all}" />
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th class="col-icon"></th>
                                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'title', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.column.title'}" />
                                <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.column.scopes" /></th>
                                <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.column.usage" /></th>
                                <th class="col-control"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{paginator.paginatedItems}" as="fragment">
                                <tr>
                                    <td class="col-icon">
                                        <button
                                            type="button"
                                            class="btn btn-link p-0"
                                            data-contextmenu-trigger="click"
                                            data-contextmenu-table="tx_aim_prompt_fragment"
                                            data-contextmenu-uid="{fragment.uid}"
                                            data-contextmenu-context=""
                                            aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.contextMenu.open.recordLabel', arguments: '{0: fragment.title}')}"
                                        >
                                            <core:iconForRecord table="tx_aim_prompt_fragment" row="{fragment}" />
                                        </button>
                                    </td>
                                    <td>
                                        <f:if condition="{showDebugInformation}">
                                            <span class="text-body-secondary">[{fragment.uid}]</span>
                                        </f:if>
                                        <f:if condition="{fragment.canEdit}">
                                            <f:then>
                                                <be:link.editRecord
                                                    table="tx_aim_prompt_fragment"
                                                    uid="{fragment.uid}"
                                                    returnUrl="{currentUrl}"
                                                    title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.editFragment')}"
                                                >{fragment.title}</be:link.editRecord>
                                            </f:then>
                                            <f:else>{fragment.title}</f:else>
                                        </f:if>
                                        <f:if condition="{fragment.isGlobal}">
                                            <span class="aim-chip" data-tone="info" title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.global.title')}">
                                                <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.global" />
                                            </span>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:for each="{fragment.scopeLabels}" as="scopeLabel">
                                            <span class="badge badge-secondary">{scopeLabel}</span>
                                        </f:for>
                                    </td>
                                    <td>
                                        <f:if condition="{fragment.usedOnPageCount} > 0">
                                            <f:then>
                                                <button
                                                    type="button"
                                                    class="btn btn-link p-0 aim-usage-toggle collapsed"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target=".aim-usage-rows-{fragment.uid}"
                                                    aria-expanded="false"
                                                >
                                                    <core:icon identifier="actions-caret-end" />
                                                    <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.usage.count" arguments="{0: fragment.usedOnPageCount}" />
                                                </button>
                                            </f:then>
                                            <f:else>
                                                <span class="text-body-secondary"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.usage.none" /></span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td class="col-control">
                                        <div class="btn-group">
                                            <f:if condition="{fragment.canEdit}">
                                                <be:link.editRecord
                                                    table="tx_aim_prompt_fragment"
                                                    uid="{fragment.uid}"
                                                    returnUrl="{currentUrl}"
                                                    class="btn btn-default"
                                                    title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.editFragment')}"
                                                    aria-label="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.editFragment')}"
                                                >
                                                    <core:icon identifier="actions-open" />
                                                </be:link.editRecord>
                                                <f:if condition="{fragment.hidden} == 1">
                                                    <f:then>
                                                        <a
                                                            class="btn btn-default"
                                                            href="{be:moduleLink(route:'tce_db', query:'data[tx_aim_prompt_fragment][{fragment.uid}][hidden]=0', arguments:'{redirect: currentUrl}')}"
                                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:unHide')}"
                                                            aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:unHide')}"
                                                        >
                                                            <core:icon identifier="actions-edit-unhide" />
                                                        </a>
                                                    </f:then>
                                                    <f:else>
                                                        <a
                                                            class="btn btn-default"
                                                            href="{be:moduleLink(route:'tce_db', query:'data[tx_aim_prompt_fragment][{fragment.uid}][hidden]=1', arguments:'{redirect: currentUrl}')}"
                                                            title="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:hide')}"
                                                            aria-label="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:hide')}"
                                                        >
                                                            <core:icon identifier="actions-edit-hide" />
                                                        </a>
                                                    </f:else>
                                                </f:if>
                                                <a
                                                    class="btn btn-default t3js-modal-trigger"
                                                    href="{be:moduleLink(route:'tce_db', query:'cmd[tx_aim_prompt_fragment][{fragment.uid}][delete]=1', arguments:'{redirect: currentUrl}')}"
                                                    title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:delete')}"
                                                    aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:delete')}"
                                                    data-severity="warning"
                                                    data-title="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_alt_doc.xlf:label.confirm.delete_record.title')}"
                                                    data-bs-content="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_alt_doc.xlf:deleteWarning')}"
                                                    data-button-close-text="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_alt_doc.xlf:buttons.confirm.delete_record.no')}"
                                                >
                                                    <core:icon identifier="actions-delete" />
                                                </a>
                                            </f:if>
                                        </div>
                                    </td>
                                </tr>
                                <f:if condition="{fragment.usedOnPageCount} > 0">
                                    <f:for each="{fragment.usedOnPages}" as="usagePage">
                                        <tr class="collapse aim-usage-rows-{fragment.uid} aim-usage-row">
                                            <td class="col-icon">
                                                <button
                                                    type="button"
                                                    class="btn btn-link p-0"
                                                    data-contextmenu-trigger="click"
                                                    data-contextmenu-table="pages"
                                                    data-contextmenu-uid="{usagePage.uid}"
                                                    data-contextmenu-context=""
                                                    aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.contextMenu.open.recordLabel', arguments: '{0: usagePage.title}')}"
                                                >
                                                    <core:iconForRecord table="pages" row="{usagePage}" />
                                                </button>
                                            </td>
                                            <td colspan="2">
                                                <f:if condition="{usagePage.editUrl}">
                                                    <f:then><a href="{usagePage.editUrl}">{usagePage.title}</a></f:then>
                                                    <f:else>{usagePage.title}</f:else>
                                                </f:if>
                                                <f:if condition="{usagePage.hidden}">
                                                    <span class="badge badge-warning"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.usage.hidden" /></span>
                                                </f:if>
                                            </td>
                                            <td></td>
                                            <td class="col-control">
                                                <div class="btn-group">
                                                    <aim-prompt-preview-toggle
                                                        target="{usagePage.previewTargetId}"
                                                        class="btn btn-default"
                                                        title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.preview')}"
                                                        aria-label="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.preview')}"
                                                    >
                                                        <core:icon identifier="actions-message-dots" />
                                                    </aim-prompt-preview-toggle>
                                                    <f:if condition="{usagePage.editUrl}">
                                                        <a
                                                            href="{usagePage.editUrl}"
                                                            class="btn btn-default"
                                                            title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.editFragments')}"
                                                            aria-label="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.editFragments')}"
                                                        >
                                                            <core:icon identifier="actions-open" />
                                                        </a>
                                                    </f:if>
                                                </div>
                                            </td>
                                        </tr>
                                    </f:for>
                                    <f:if condition="{fragment.usedOnPagesTruncatedCount} > 0">
                                        <tr class="collapse aim-usage-rows-{fragment.uid}">
                                            <td class="col-icon"></td>
                                            <td colspan="4" class="text-body-secondary">
                                                <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.usage.andMore" arguments="{0: fragment.usedOnPagesTruncatedCount}" />
                                            </td>
                                        </tr>
                                    </f:if>
                                </f:if>
                            </f:for>
                        </tbody>
                    </table>
                </div>
                <f:render partial="Pagination" arguments="{paginator: paginator, pagination: pagination, baseUrl: paginationBaseUrl}" />
            </f:then>
            <f:else>
                <f:if condition="{demand.constraints}">
                    <f:then>
                        <f:render partial="PromptManagementFilter" arguments="{_all}" />
                        <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noMatches.title')}" state="-1">
                            <p><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noMatches.message" /></p>
                            <a href="{f:be.uri(route: 'aim_prompt_management', parameters: '{view: \'library\', id: selectedPageId}')}" class="btn btn-default">
                                <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:filter.reset" />
                            </a>
                        </f:be.infobox>
                    </f:then>
                    <f:else>
                        <f:if condition="{selectedPageId} > 0">
                            <f:then>
                                <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noFragmentsInSubtree.title')}" state="-1">
                                    <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noFragmentsInSubtree.message" arguments="{0: selectedPageTitle}" />
                                </f:be.infobox>
                            </f:then>
                            <f:else>
                                <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noFragmentsAtAll.title')}" state="-1">
                                    <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.library.noFragmentsAtAll.message" />
                                </f:be.infobox>
                            </f:else>
                        </f:if>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </f:then>
    <f:else>
        <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.noReadAccess.title')}" state="1">
            <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.noReadAccess.message" />
        </f:be.infobox>
    </f:else>
</f:if>

</html>
