<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="table-fit">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'crdate', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.timestamp'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'extension_key', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.extension'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'username', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.user'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'request_type', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.requestType'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'provider_identifier', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.provider'}" />
                <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.model" /></th>
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'total_tokens', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.tokens'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'cost', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.cost'}" />
                <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'duration_ms', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.duration'}" />
                <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.grade" /></th>
                <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:requestLog.column.status" /></th>
                <th class="col-control">
                    <span class="visually-hidden"><f:translate key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels._CONTROL_" /></span>
                </th>
            </tr>
        </thead>
        <tbody data-poll="rows">
            <f:for each="{paginator.paginatedItems}" as="entry">
                <f:render partial="RequestLog/Row" arguments="{entry: entry, extensionIcons: extensionIcons, userMap: userMap, returnUrl: returnUrl}" />
            </f:for>
        </tbody>
    </table>
</div>

</html>
