<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:be.pageRenderer
        includeCssFiles="{
            0: 'EXT:aim/Resources/Public/Css/base.css',
        }"
        includeJavaScriptModules="{
            0: '@b13/aim/prompt-preview.js',
            1: '@typo3/backend/context-menu.js',
            2: '@b13/aim/calibrate-voice-trigger.js',
        }"
    />

    <div
        id="pp-module-state"
        data-has-explicit-page-id="{f:if(condition: requestCarriedExplicitPageId, then: '1', else: '0')}"
        hidden
    ></div>

    <template
        id="pp-panel-general"
        data-page-id=""
        data-modal-title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.modalTitle.general')}"
        data-label-empty="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.empty')}"
        data-label-characters="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.characters.label')}"
        data-label-tokens="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.tokens.label')}"
        data-label-page-tone="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.pageTone')}"
        data-label-global-fallback="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.globalFallback')}"
        data-label-user-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.userFragments')}"
        data-label-registry-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.registryFragments')}"
        data-label-provider-addendum="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.providerAddendum')}"
    >
        <f:render partial="PromptPreviewPanel" arguments="{scopeOptions: scopeOptions, providerConfigurations: providerConfigurations}" />
    </template>

    <f:if condition="{selectedPageId} > 0">
        <p class="alert alert-info">
            <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.filteringToSubtree" arguments="{0: selectedPageTitle}" />
            <a href="{f:be.uri(route:'aim_prompt_preview', parameters: '{id: 0}')}"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.filteringToSubtree.clear" /></a>
        </p>
        <template
            id="pp-panel-selected"
            data-page-id="{selectedPageId}"
            data-modal-title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.modalTitle', arguments: '{0: selectedPageTitle}')}"
            data-label-empty="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.empty')}"
            data-label-characters="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.characters.label')}"
            data-label-tokens="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.tokens.label')}"
            data-label-page-tone="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.pageTone')}"
            data-label-global-fallback="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.globalFallback')}"
            data-label-user-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.userFragments')}"
            data-label-registry-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.registryFragments')}"
            data-label-provider-addendum="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.providerAddendum')}"
        >
            <f:render partial="PromptPreviewPanel" arguments="{scopeOptions: scopeOptions, providerConfigurations: providerConfigurations}" />
        </template>
    </f:if>

    <f:if condition="{hasAnyAccessiblePages}">
        <f:then>
            <f:if condition="{paginator.paginatedItems}">
                <f:then>
                    <f:render section="filter" arguments="{_all}" />
                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th class="col-icon"></th>
                                    <f:render partial="SortableHeader" arguments="{sortUrls: sortUrls, field: 'title', labelKey: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.column.title'}" />
                                    <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.column.scopes" /></th>
                                    <th><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.column.fragments" /></th>
                                    <th class="col-control"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{paginator.paginatedItems}" as="page">
                                    <tr>
                                        <td class="col-icon">
                                            <button
                                                type="button"
                                                class="btn btn-link p-0"
                                                data-contextmenu-trigger="click"
                                                data-contextmenu-table="pages"
                                                data-contextmenu-uid="{page.uid}"
                                                data-contextmenu-context=""
                                                aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.contextMenu.open.recordLabel', arguments: '{0: page.title}')}"
                                            >
                                                <core:iconForRecord table="pages" row="{page}" />
                                            </button>
                                        </td>
                                        <td>
                                            <f:if condition="{showDebugInformation}">
                                                <span class="text-body-secondary">[{page.uid}]</span>
                                            </f:if>
                                            <f:if condition="{page.canEdit}">
                                                <f:then>
                                                    <be:link.editRecord
                                                        table="pages"
                                                        uid="{page.uid}"
                                                        fields="tx_aim_prompt_fragments,tx_aim_disable_inherited_fragments"
                                                        returnUrl="{currentUrl}"
                                                        title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.editFragments')}"
                                                    >{page.title}</be:link.editRecord>
                                                </f:then>
                                                <f:else>{page.title}</f:else>
                                            </f:if>
                                            <f:if condition="{page.tx_aim_disable_inherited_fragments}">
                                                <span class="badge badge-warning"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.inheritanceDisabled" /></span>
                                            </f:if>
                                        </td>
                                        <td>
                                            <f:for each="{page.scopeLabels}" as="scopeLabel">
                                                <span class="badge badge-secondary">{scopeLabel}</span>
                                            </f:for>
                                        </td>
                                        <td>{page.fragmentCount}</td>
                                        <td class="col-control">
                                            <div class="btn-group">
                                                <aim-prompt-preview-toggle
                                                    target="pp-panel-row-{page.uid}"
                                                    class="btn btn-default"
                                                    title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.preview')}"
                                                    aria-label="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.preview')}"
                                                >
                                                    <core:icon identifier="actions-message-dots" />
                                                </aim-prompt-preview-toggle>
                                                <f:if condition="{page.canEdit}">
                                                    <be:link.editRecord
                                                        table="pages"
                                                        uid="{page.uid}"
                                                        fields="tx_aim_prompt_fragments,tx_aim_disable_inherited_fragments"
                                                        returnUrl="{currentUrl}"
                                                        class="btn btn-default"
                                                        title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.editFragments')}"
                                                        aria-label="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.editFragments')}"
                                                    >
                                                        <core:icon identifier="actions-open" />
                                                    </be:link.editRecord>
                                                </f:if>
                                            </div>
                                        </td>
                                    </tr>
                                    <template
                                        id="pp-panel-row-{page.uid}"
                                        data-page-id="{page.uid}"
                                        data-modal-title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.modalTitle', arguments: '{0: page.title}')}"
                                        data-label-empty="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.empty')}"
                                        data-label-characters="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.characters.label')}"
                                        data-label-tokens="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.result.tokens.label')}"
                                        data-label-page-tone="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.pageTone')}"
                                        data-label-global-fallback="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.globalFallback')}"
                                        data-label-user-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.userFragments')}"
                                        data-label-registry-fragments="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.registryFragments')}"
                                        data-label-provider-addendum="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.layer.providerAddendum')}"
                                    >
                                        <f:render partial="PromptPreviewPanel" arguments="{scopeOptions: scopeOptions, providerConfigurations: providerConfigurations}" />
                                    </template>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <f:render partial="Pagination" arguments="{paginator: paginator, pagination: pagination, baseUrl: paginationBaseUrl}" />
                </f:then>
                <f:else>
                    <f:if condition="{demand.constraints}">
                        <f:then>
                            <f:render section="filter" arguments="{_all}" />
                            <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noMatches.title')}" state="-1">
                                <p><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noMatches.message" /></p>
                                <a href="{f:be.uri(route:'aim_prompt_preview', parameters: '{id: selectedPageId}')}" class="btn btn-default">
                                    <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:filter.reset" />
                                </a>
                            </f:be.infobox>
                        </f:then>
                        <f:else>
                            <f:if condition="{selectedPageId} > 0">
                                <f:then>
                                    <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noFragmentsInSubtree.title')}" state="-1">
                                        <p><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noFragmentsInSubtree.message" arguments="{0: selectedPageTitle}" /></p>
                                        <f:if condition="{createPromptUrl}">
                                            <a href="{createPromptUrl}" class="btn aim-btn-primary">
                                                <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.createPrompt" />
                                            </a>
                                        </f:if>
                                    </f:be.infobox>
                                </f:then>
                                <f:else>
                                    <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noFragmentsAtAll.title')}" state="-1">
                                        <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noFragmentsAtAll.message" />
                                    </f:be.infobox>
                                </f:else>
                            </f:if>
                        </f:else>
                    </f:if>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <f:be.infobox title="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noAccessiblePages.title')}" state="1">
                <f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.list.noAccessiblePages.message" />
            </f:be.infobox>
        </f:else>
    </f:if>

    <div id="b13_loves_typo3">
        <a href="https://b13.com?utm_source=web&utm_medium=dashboard&utm_campaign=aim&utm_id=aim" target="_blank" rel="external">
            made with ❤ by b13
        </a>
    </div>
</f:section>

<f:section name="filter">
    <form action="{f:be.uri(route:'aim_prompt_preview')}" method="post" enctype="multipart/form-data" name="demand">
        <input type="hidden" name="orderField" value="{demand.orderField}">
        <input type="hidden" name="orderDirection" value="{demand.orderDirection}">
        <input type="hidden" name="id" value="{selectedPageId}">
        <div class="form-row">
            <div class="form-group">
                <label for="demand-search" class="form-label"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.filter.search.label" /></label>
                <input type="text" id="demand-search" class="form-control" name="demand[search]" value="{demand.search}" />
            </div>
            <div class="form-group">
                <label for="demand-scope" class="form-label"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.filter.scope.label" /></label>
                <select id="demand-scope" class="form-select" name="demand[scope]" data-on-change="submit">
                    <option value=""><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:promptPreview.filter.scope.showAll" /></option>
                    <f:for each="{scopeOptions}" as="option">
                        <option value="{option.value}" {f:if(condition: '{option.value} == {demand.scopeValue}', then: 'selected')}>{option.label}</option>
                    </f:for>
                </select>
            </div>
            <div class="form-group align-self-end">
                <input type="submit" value="{f:translate(key: 'LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:filter.submit')}" class="btn btn-default" />
                <a href="{f:be.uri(route:'aim_prompt_preview', parameters: '{id: selectedPageId}')}" class="btn btn-link"><f:translate key="LLL:EXT:aim/Resources/Private/Language/locallang_module.xlf:filter.reset" /></a>
            </div>
        </div>
    </form>
</f:section>

</html>
