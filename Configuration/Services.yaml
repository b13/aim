services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  B13\Aim\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Provider/SymfonyAi/*'
      - '../Classes/Widgets/*'

  B13\Aim\Domain\Repository\ProviderConfigurationRepository:
    public: true

  B13\Aim\Crypto\ApiKeyEncryption:
    public: true

  B13\Aim\Hooks\EncryptApiKey:
    public: true

  B13\Aim\Backend\FormDataProvider\HideApiKey:
    public: true

  B13\Aim\Backend\FormDataProvider\DisableAddRecordOnUnsavedAssignment:
    public: true

  B13\Aim\Prompt\PagePromptResolver:
    public: true

  B13\Aim\Domain\Repository\PagePromptFragmentRepository:
    public: true

  B13\Aim\Backend\PageTreeResolver:
    public: true

  B13\Aim\Backend\Form\PagePromptFragmentLabelUserFunc:
    public: true

  B13\Aim\EventListener\RecordBudgetUsageListener:
    tags:
      - name: event.listener
        identifier: 'aim/record-budget-usage'

  B13\Aim\Controller\ProviderController:
    public: true

  B13\Aim\Controller\RequestLogController:
    public: true

  B13\Aim\Controller\PromptManagementController:
    public: true
