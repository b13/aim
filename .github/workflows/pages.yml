name: Pages

on:
  push:
    branches: [main]
    # The site is generated from the guides and the changelog, so a change to
    # any of them has to redeploy it, not just a change to docs/ itself.
    paths:
      - 'docs/**'
      - 'Documentation/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate on purpose. The artifact is named
  # "github-pages" by the action and cannot be renamed, and an artifact from a
  # previous attempt stays attached to the run. With both steps in one job,
  # "Re-run all jobs" uploads a second artifact with the same name and the
  # deployment fails with "Multiple artifacts named github-pages were
  # unexpectedly found". Split, the recovery is "Re-run failed jobs": only
  # deploy runs again, nothing is uploaded twice, and it picks up the artifact
  # the build job already produced.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the build dependencies
        run: pip install --quiet markdown pillow

      # docs/build.py renders Documentation/*.md and CHANGELOG.md into the
      # landing page's own styling and copies in only the screenshots they
      # reference, so neither the HTML nor the images are stored twice in the
      # repository. It also writes .nojekyll, which keeps Pages from running
      # the markdown in the repository through Jekyll.
      - name: Build the site
        run: python3 docs/build.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
